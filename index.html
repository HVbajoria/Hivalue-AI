              },
              card: {

              },
              // Keeping original custom colors for backward compatibility
              dark: '#0f172a', 
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            keyframes: {
              'scale-up-brief': {

                '0%': { opacity: '0' },

              },

                '50%': { backgroundPosition: '100% 50%' },
              },
            },
            animation: {
              'scale-up-brief': 'scale-up-brief 0.4s ease-out forwards',

            },

              '200': '200% 200%',
            },
